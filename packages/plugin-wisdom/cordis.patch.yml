# 山海·开铺 · 智囊团插件 · patch 层
# =====================================================================
# 由本包 package.json 的
#   "dsh": { "bundle": { "patch": "./cordis.patch.yml" } }
# 声明，作为 profile 的一个 bundle 层被加载。
#
# ★ 本包可单独卸载：摘掉本文件这段 insert + 删掉整个包目录
#   ⇒ 场地插件（@shanhai/kaipu-platform）仍完整可用。
#   所以本包不依赖场地插件，也不往场地的座位里塞东西。
# =====================================================================

- insert:
    - id: shanhai-kaipu-wisdom-team
      name: '@shanhai/kaipu-wisdom-team'
      config:
        # 内置谋士团队的展示。客户带了自己的 Agent 时，席位可被顶替。
        builtinSample: true
        # 灯组定义从服务端拉；此处只留本地兜底开关。
        lampGroups: []
